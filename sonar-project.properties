# ==========================================================
# ? Configurações principais do projeto
# ==========================================================
sonar.projectKey=br.com.greenngoconnect:rippleimpact
sonar.projectName=RippleImpact API
sonar.projectVersion=1.0.0

# Diretório base do código fonte
sonar.sources=src/main/java

# Diretório dos testes
sonar.tests=src/test/java

# Linguagem principal
sonar.language=java

# Encoding padrão
sonar.sourceEncoding=UTF-8


# ==========================================================
# ? Relatórios de cobertura (gerados pelo JaCoCo)
# ==========================================================
# Caminho para o relatório XML do JaCoCo (gerado em mvn verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml


# ==========================================================
# ? Exclusões de análise e cobertura
# ==========================================================
# Exclui pacotes utilitários e classes auxiliares da análise de cobertura
sonar.coverage.exclusions=**/commons/**,**/utils/**,**/config/**,**/exception/**,**/dto/**,**/mapper/**,**/filter/**,**/security/**,**/SwaggerConfig.java,**/RestUtils.java

# Exclui também da análise estática (ex: não considerar problemas de code smell/não cobrir)
sonar.exclusions=**/commons/**,**/utils/**,**/config/**,**/dto/**,**/mapper/**,**/filter/**,**/exception/**


# ==========================================================
# ? Testes e relatórios adicionais (opcional)
# ==========================================================
# Se você usa JUnit 5 (Surefire padrão do Maven)
sonar.junit.reportPaths=target/surefire-reports

# Se tiver relatórios de integração (Failsafe)
# sonar.junit.reportPaths=target/failsafe-reports


# ==========================================================
# ? Configurações do servidor Sonar
# ==========================================================
# URL do servidor SonarQube
sonar.host.url=http://localhost:9000

# Token de autenticação (gerado no SonarQube ? My Account ? Security)
# ?? NÃO comitar isso no Git! Configure como variável de ambiente:
# export SONAR_TOKEN=seu_token_aqui
sonar.login=${env.SONAR_TOKEN}
